version: 2
updates:
  - package-ecosystem: maven
    directory: /web/backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    ignore:
      # OpenPDF 2.1.0 e successive sono compilate per Java 21; il backend resta su Java 17
      # (master A.8). Da rivalutare insieme a un eventuale passaggio a Java 21.
      - dependency-name: "com.github.librepdf:openpdf"
        versions: [">= 2.1.0"]
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: npm
    directory: /web/frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:20"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    ignore:
      # TypeScript 7 (compilatore riscritto) rinviato per decisione del 2026-10-24: da rivalutare
      # entro gennaio 2027. Le versioni minori e patch della linea 6 restano proposte.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-runtime:
        patterns:
          - react
          - react-dom
      frontend-tooling:
        dependency-type: development
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:40"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
      include: scope
